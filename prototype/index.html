<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO Animasyon Prototipi</title>
<style>
  :root { --red:#e5322d; --yellow:#f5c400; --green:#2fa84f; --blue:#1e6fd9; --cw:90px; --ch:135px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#070b16; color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; -webkit-user-select:none; }

  /* ---------- masa ---------- */
  #table { position:fixed; inset:0; --tint:#3a4466;
    background:radial-gradient(ellipse 120% 90% at 50% 50%, #16203d 0%, #0a0f1f 60%, #05070f 100%); }
  #tint { position:absolute; inset:0; opacity:.5; pointer-events:none;
    background:radial-gradient(ellipse 55% 50% at 50% 50%, var(--tint), transparent 72%); }
  #stage { position:absolute; inset:0; }
  #felt { position:absolute; left:0; top:0; border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.07), rgba(255,255,255,.015) 70%);
    border:2px solid rgba(255,255,255,.08); box-shadow:inset 0 0 60px rgba(0,0,0,.45); }
  #colorRing { position:absolute; left:0; top:0; border-radius:50%; border:4px solid #3a4466; opacity:.85;
    box-shadow:0 0 24px rgba(255,255,255,.12); }
  #deckGlow { position:absolute; left:0; top:0; border-radius:14px; border:3px solid #fff; opacity:0; pointer-events:none; }
  #deckGlow.show { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.15; transform:translate(-50%,-50%) scale(1); }
                     50% { opacity:.9; transform:translate(-50%,-50%) scale(1.06); } }
  #cards, #fx { position:absolute; inset:0; }
  #fx { pointer-events:none; }

  /* ---------- kart: Slot (konum) > Inter (hover) > Flip (çevirme) > yüzler ---------- */
  .slot { position:absolute; left:0; top:0; width:var(--cw); height:var(--ch); perspective:900px; }
  .inter, .flip { position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .face { position:absolute; inset:0; border-radius:calc(var(--cw) * .1); background:#fff; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.15); transition:filter .3s, box-shadow .3s; }
  .back { transform:rotateY(180deg); }
  .in { position:absolute; inset:calc(var(--cw) * .06); border-radius:calc(var(--cw) * .07); background:var(--c); overflow:hidden; }
  .oval { position:absolute; left:50%; top:50%; width:86%; height:68%; border-radius:50%; background:#fff;
    transform:translate(-50%,-50%) rotate(-28deg); }
  .big { position:absolute; inset:0; display:grid; place-items:center; font-weight:900; letter-spacing:-.04em;
    font-size:calc(var(--cw) * .44); color:var(--c); text-shadow:.05em .05em 0 #000; }
  .corner { position:absolute; font-weight:900; font-size:calc(var(--cw) * .17); line-height:1; text-shadow:.06em .06em 0 #000; }
  .corner.tl { left:9%; top:6%; }
  .corner.br { right:9%; bottom:6%; transform:rotate(180deg); }
  .wild .oval { background:conic-gradient(var(--red) 0 25%, var(--blue) 0 50%, var(--yellow) 0 75%, var(--green) 0); }
  .wild .big { color:#fff; }
  .back .in { background:#141414; }
  .back .oval { background:var(--red); box-shadow:inset 0 0 0 calc(var(--cw) * .025) #fff; }
  .back .logo { position:absolute; inset:0; display:grid; place-items:center; transform:rotate(-28deg);
    font-weight:900; font-style:italic; font-size:calc(var(--cw) * .26); color:var(--yellow); text-shadow:.06em .06em 0 #000; }
  .shine { position:absolute; inset:0; pointer-events:none; transform:translateX(-130%);
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.6) 50%, transparent 65%); }
  .slot.mine:hover .shine { transform:translateX(130%); transition:transform .6s ease; }
  .slot.playable, .slot.drawable { cursor:pointer; }
  .slot.playable .front { box-shadow:0 0 0 calc(var(--cw) * .03) #fff, 0 0 calc(var(--cw) * .28) rgba(255,255,255,.75); }
  .slot.dim .front { filter:brightness(.55) saturate(.45); }

  /* ---------- efektler ---------- */
  .ring { position:absolute; left:0; top:0; border-radius:50%; border:5px solid #fff; }
  .spark { position:absolute; left:0; top:0; width:9px; height:9px; border-radius:50%; box-shadow:0 0 10px currentColor; }
  .wave { position:absolute; left:0; top:0; border-radius:50%; }
  .float { position:absolute; left:0; top:0; white-space:nowrap; font-weight:900; font-style:italic;
    font-size:calc(var(--cw) * .5); text-shadow:0 4px 0 #000, 0 0 24px rgba(0,0,0,.6); }

  /* ---------- HUD ---------- */
  .seat { position:absolute; left:0; top:0; display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px;
    border-radius:999px; background:rgba(8,12,26,.75); border:1px solid rgba(255,255,255,.12);
    font-size:13px; white-space:nowrap; transition:box-shadow .35s, border-color .35s; }
  .seat .av { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800;
    background:linear-gradient(135deg,#6a7bff,#c64bff); }
  .seat .ct { min-width:22px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,.14); text-align:center; font-weight:700; }
  .seat.active { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 0 22px rgba(255,255,255,.55); }
  #seat0 { left:16px; top:auto; bottom:16px; }
  #status { position:absolute; left:0; top:0; font-size:14px; color:rgba(255,255,255,.8); white-space:nowrap;
    padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.35); }

  #ui { position:absolute; inset:0; pointer-events:none; z-index:50; }
  #ui > * { pointer-events:auto; }
  #controls { position:absolute; top:12px; left:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; border-radius:12px; background:rgba(8,12,26,.75); border:1px solid rgba(255,255,255,.12); font-size:13px; }
  #controls button, #banner button { font:inherit; font-weight:700; color:#fff; cursor:pointer; border:0;
    padding:7px 14px; border-radius:8px; background:linear-gradient(135deg,#ff5a4e,#e5322d); }
  @media (max-width:600px) {
    #controls { top:auto; bottom:calc(var(--ch) * 1.8); left:50%; transform:translateX(-50%); padding:5px 8px; flex-wrap:nowrap; white-space:nowrap; }
  }
  #controls label { display:flex; align-items:center; gap:6px; }
  #controls input { width:90px; accent-color:#f5c400; }
  .pick { position:absolute; left:0; top:0; border-radius:50%; border:4px solid #fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.5); }
  #banner { position:absolute; left:50%; top:50%; display:none; flex-direction:column; align-items:center; gap:16px;
    padding:28px 40px; border-radius:20px; background:rgba(8,12,26,.9); border:2px solid rgba(255,255,255,.2);
    box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #banner h2 { font-size:34px; font-style:italic; font-weight:900; }
</style>
</head>
<body>
<div id="table">
  <div id="tint"></div>
  <div id="stage">
    <div id="felt"></div>
    <div id="colorRing"></div>
    <div id="deckGlow"></div>
    <div id="cards"></div>
    <div id="fx"></div>
    <div class="seat" id="seat0"><span class="av">S</span><span>Sen</span><span class="ct">0</span></div>
    <div class="seat" id="seat1"><span class="av">A</span><span>Ayşe</span><span class="ct">0</span></div>
    <div class="seat" id="seat2"><span class="av">M</span><span>Mert</span><span class="ct">0</span></div>
    <div class="seat" id="seat3"><span class="av">D</span><span>Deniz</span><span class="ct">0</span></div>
    <div id="status"></div>
  </div>
  <div id="ui">
    <div id="controls">
      <button id="restart">Yeniden dağıt</button>
      <label>Hız <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedVal">1x</span></label>
    </div>
    <div id="banner"><h2 id="bannerText"></h2><button id="again">Tekrar oyna</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MotionPathPlugin.min.js"></script>
<script>
gsap.registerPlugin(MotionPathPlugin);

const COLORS = ['red', 'yellow', 'green', 'blue'];
const HEX = { red:'#e5322d', yellow:'#f5c400', green:'#2fa84f', blue:'#1e6fd9' };
const SYM = { skip:'⊘', reverse:'⇄', draw2:'+2', wild:'', wild4:'+4' };
const NAMES = ['Sen', 'Ayşe', 'Mert', 'Deniz'];

const $ = s => document.querySelector(s);
const table = $('#table'), layer = $('#cards'), fx = $('#fx'), ui = $('#ui');
const wait = s => new Promise(r => gsap.delayedCall(s, r));   // global hız ayarından etkilenir
const rand = gsap.utils.random;

let W, H, CW, CH, deckPos, pilePos;
let cards = [], deck = [], discard = [], hands = [[], [], [], []];
let turn = 0, color = null, busy = true, gameOver = false;

// ================= kartlar =================
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function makeCard(c, v, id) {
  const el = document.createElement('div');
  el.className = 'slot';
  const wild = c === 'wild', label = SYM[v] ?? v, corner = label || '★';
  el.innerHTML = `<div class="inter"><div class="flip">
      <div class="face front ${wild ? 'wild' : ''}" style="--c:${wild ? '#111' : HEX[c]}"><div class="in">
        <div class="oval"></div><div class="big">${label}</div>
        <span class="corner tl">${corner}</span><span class="corner br">${corner}</span>
      </div><div class="shine"></div></div>
      <div class="face back"><div class="in"><div class="oval"></div><div class="logo">★</div></div></div>
    </div></div>`;
  layer.append(el);
  const card = { id, color:c, value:v, el, inter:el.firstElementChild, flip:el.querySelector('.flip'),
                 zone:'deck', owner:-1, rot:0, dx:0, dy:0 };
  gsap.set(el, { xPercent:-50, yPercent:-50 });
  el.addEventListener('click', () => onCardClick(card));
  el.addEventListener('mouseenter', () => hover(card, true));
  el.addEventListener('mouseleave', () => hover(card, false));
  return card;
}

function buildCards() {
  layer.innerHTML = ''; cards = []; let id = 0;
  const add = (c, v) => cards.push(makeCard(c, v, id++));
  for (const c of COLORS) {
    add(c, '0');
    for (let n = 1; n <= 9; n++) { add(c, String(n)); add(c, String(n)); }
    for (const v of ['skip', 'reverse', 'draw2']) { add(c, v); add(c, v); }
  }
  for (let i = 0; i < 4; i++) { add('wild', 'wild'); add('wild', 'wild4'); }
}

// ================= yerleşim (bölge → hedef konum) =================
function measure() {
  W = innerWidth; H = innerHeight;
  CW = Math.round(Math.max(52, Math.min(105, W * 0.12, H * 0.13)));
  CH = Math.round(CW * 1.5);
  document.documentElement.style.setProperty('--cw', CW + 'px');
  document.documentElement.style.setProperty('--ch', CH + 'px');
  deckPos = { x:W / 2 - CW * 0.8, y:H / 2 - CH * 0.08 };
  pilePos = { x:W / 2 + CW * 0.8, y:H / 2 - CH * 0.08 };
}

function seat(p) {
  return [ { x:W / 2, y:H - CH * 0.78, a:0 },
           { x:CH * 0.42, y:H / 2, a:90 },
           { x:W / 2, y:CH * 0.48, a:180 },
           { x:W - CH * 0.42, y:H / 2, a:-90 } ][p];
}

function handTarget(p, i, n) {
  const s = seat(p), me = p === 0;
  const R = me ? CH * 3.4 : CH * 2.2;
  let step = me ? 7 : 6;
  if (n > 1) step = Math.min(step, (me ? 56 : 44) / (n - 1));
  if (me && n > 1) { // yelpaze ekrana sığsın
    const maxW = W * 0.86 - CW;
    if (2 * R * Math.sin((n - 1) * step * Math.PI / 360) > maxW)
      step = 2 * Math.asin(Math.min(1, maxW / (2 * R))) * 180 / Math.PI / (n - 1);
  }
  const a = (i - (n - 1) / 2) * step, ar = a * Math.PI / 180, t = s.a * Math.PI / 180;
  const lx = R * Math.sin(ar), ly = R * (1 - Math.cos(ar));
  return { x:s.x + lx * Math.cos(t) - ly * Math.sin(t), y:s.y + lx * Math.sin(t) + ly * Math.cos(t),
           rot:a + s.a, scale:me ? 1 : 0.6, up:me, z:(me ? 500 : 300) + i };
}

function targetOf(c) {
  if (c.zone === 'deck') {
    const i = deck.indexOf(c);
    return { x:deckPos.x - i * 0.18, y:deckPos.y - i * 0.28, rot:0, scale:1, up:false, z:10 + i };
  }
  if (c.zone === 'discard') {
    const i = discard.indexOf(c);
    return { x:pilePos.x + c.dx, y:pilePos.y + c.dy, rot:c.rot, scale:1, up:true, z:150 + i };
  }
  const h = hands[c.owner];
  return handTarget(c.owner, h.indexOf(c), h.length);
}

function place(c) {
  const t = targetOf(c);
  gsap.set(c.el, { x:t.x, y:t.y, rotation:t.rot, scale:t.scale, zIndex:t.z });
  gsap.set(c.flip, { rotationY:t.up ? 0 : 180 });
}

function setPos(el, x, y, extra = {}) { gsap.set(el, { x, y, xPercent:-50, yPercent:-50, ...extra }); }

function layoutStatic() {
  setPos('#felt', W / 2, H / 2 - CH * 0.08, { width:Math.min(W * 0.66, CW * 6.5), height:CH * 2 });
  setPos('#colorRing', pilePos.x, pilePos.y, { width:CH * 1.45, height:CH * 1.45 });
  setPos('#deckGlow', deckPos.x - 10, deckPos.y - 14, { width:CW + 14, height:CH + 14 });
  const clampX = x => Math.min(W - 64, Math.max(64, x));
  setPos('#seat1', clampX(CH * 0.45), H / 2 - CH * 1.3);
  if (W < 600) setPos('#seat2', W / 2, CH * 1.15);
  else setPos('#seat2', W / 2 + CH * 1.4, CH * 0.48);
  setPos('#seat3', clampX(W - CH * 0.45), H / 2 - CH * 1.3);
  setPos('#status', W / 2, H / 2 + CH * 0.8);
  gsap.set('#banner', { xPercent:-50, yPercent:-50 });
}

function relayoutHand(p, dur = 0.4, stagger = 0.02, except = null) {
  const h = hands[p];
  h.forEach((c, i) => {
    if (c === except) return;
    const t = handTarget(p, i, h.length);
    gsap.set(c.el, { zIndex:t.z });
    gsap.to(c.el, { x:t.x, y:t.y, rotation:t.rot, scale:t.scale, duration:dur, delay:i * stagger, ease:'power3.out', overwrite:'auto' });
  });
}

// ================= temel hareket: yay çizerek uçma =================
function fly(c, t, o = {}) {
  const el = c.el, x0 = gsap.getProperty(el, 'x'), y0 = gsap.getProperty(el, 'y');
  const dur = o.dur ?? 0.5;
  const lift = o.lift ?? Math.min(180, Math.hypot(t.x - x0, t.y - y0) * 0.35);
  const mid = { x:(x0 + t.x) / 2, y:(y0 + t.y) / 2 - lift };
  gsap.set(el, { zIndex:2000 });
  const tl = gsap.timeline({ onComplete:() => gsap.set(el, { zIndex:t.z, rotation:t.rot }) });
  tl.to(el, { motionPath:{ path:[{ x:x0, y:y0 }, mid, { x:t.x, y:t.y }], curviness:1.25 }, duration:dur, ease:o.ease || 'power2.inOut' }, 0);
  tl.to(el, { rotation:t.rot + (o.spin || 0), duration:dur, ease:'power2.inOut' }, 0);
  if (o.squash) { // havada büyür, inişte ezilir, yaylanarak oturur
    tl.to(el, { keyframes:[{ scale:t.scale * 1.3, duration:dur * 0.5, ease:'power1.out' },
                           { scale:t.scale * 0.88, duration:dur * 0.5, ease:'power2.in' }] }, 0);
    tl.to(el, { scale:t.scale, duration:0.45, ease:'elastic.out(1.1,0.4)' }, dur);
  } else {
    tl.to(el, { keyframes:[{ scale:t.scale * (o.peak || 1.12), duration:dur * 0.5 }, { scale:t.scale, duration:dur * 0.5 }] }, 0);
  }
  const ry = t.up ? 0 : 180;
  if (gsap.getProperty(c.flip, 'rotationY') !== ry)
    tl.to(c.flip, { rotationY:ry, duration:dur * 0.6, ease:'power2.inOut' }, o.flipDelay ?? dur * 0.2);
  return tl;
}

// ================= efektler =================
function impact(x, y, hex) {
  const ring = document.createElement('div');
  ring.className = 'ring'; ring.style.borderColor = hex; fx.append(ring);
  setPos(ring, x, y, { width:CW * 1.3, height:CW * 1.3, scale:0.4 });
  gsap.to(ring, { scale:3, opacity:0, duration:0.7, ease:'power2.out', onComplete:() => ring.remove() });
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'spark'; s.style.background = s.style.color = i % 3 ? hex : '#fff'; fx.append(s);
    const a = Math.random() * Math.PI * 2, d = CW * rand(0.8, 2.2);
    setPos(s, x, y);
    gsap.to(s, { x:x + Math.cos(a) * d, y:y + Math.sin(a) * d, scale:0, duration:rand(0.45, 0.9), ease:'power3.out', onComplete:() => s.remove() });
  }
  gsap.fromTo('#cards', { y:5 }, { y:0, duration:0.5, ease:'elastic.out(1,0.3)' });
}

function colorWave(hex) {
  const w = document.createElement('div');
  w.className = 'wave'; w.style.background = `radial-gradient(circle, transparent 40%, ${hex} 65%, transparent 72%)`;
  fx.append(w);
  const size = Math.hypot(W, H) * 2.2;
  setPos(w, pilePos.x, pilePos.y, { width:size, height:size, scale:0.02, opacity:0.9 });
  gsap.to(w, { scale:1, opacity:0, duration:1.1, ease:'power2.out', onComplete:() => w.remove() });
}

function floatText(text, x, y, hex = '#fff') {
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = text; f.style.color = hex; fx.append(f);
  setPos(f, x, y);
  gsap.timeline({ onComplete:() => f.remove() })
    .from(f, { scale:0, rotation:-15, duration:0.45, ease:'back.out(3)' })
    .to(f, { y:y - CH * 0.6, opacity:0, duration:0.6, ease:'power1.in' }, '+=0.45');
}

function setColor(c, big) {
  color = c;
  gsap.to(table, { '--tint':HEX[c], duration:0.8 });
  gsap.fromTo('#colorRing', { scale:1.25 }, { scale:1, borderColor:HEX[c], duration:0.6, ease:'back.out(2)' });
  if (big) colorWave(HEX[c]);
}

// ================= HUD =================
function updateSeats() {
  for (let p = 0; p < 4; p++) {
    const s = $('#seat' + p);
    s.querySelector('.ct').textContent = hands[p].length;
    s.classList.toggle('active', p === turn && !gameOver);
  }
}

function updateHints() {
  const myTurn = turn === 0 && !busy && !gameOver;
  let any = false;
  for (const c of cards) {
    const mine = c.zone === 'hand' && c.owner === 0;
    const ok = mine && myTurn && playable(c);
    any ||= ok;
    c.el.classList.toggle('mine', mine);
    c.el.classList.toggle('playable', ok);
    c.el.classList.toggle('dim', mine && myTurn && !ok);
    c.el.classList.toggle('drawable', c.zone === 'deck' && myTurn);
  }
  $('#deckGlow').classList.toggle('show', myTurn && !any);
  $('#status').textContent = gameOver ? '' : myTurn
    ? (any ? 'Sıran — parlayan bir kartı oyna' : 'Oynayacak kartın yok — desteden çek')
    : turn === 0 ? '' : `${NAMES[turn]} düşünüyor…`;
}

// ================= etkileşim =================
function hover(card, on) {
  if (card.zone !== 'hand' || card.owner !== 0) return;
  const h = hands[0], i = h.indexOf(card);
  h.forEach((c, j) => {
    const d = j - i; let x = 0, y = 0, s = 1;
    if (on) {
      if (d === 0) { y = -CH * 0.22; s = 1.1; }
      else if (Math.abs(d) <= 2) x = Math.sign(d) * CW * (Math.abs(d) === 1 ? 0.28 : 0.12);
    }
    gsap.to(c.inter, { x, y, scale:s, duration:0.35, ease:on ? 'back.out(2)' : 'power2.out', overwrite:true });
  });
  gsap.set(card.el, { zIndex:on ? 900 : handTarget(0, i, h.length).z });
}

function clearHover() { hands[0].forEach(c => gsap.to(c.inter, { x:0, y:0, scale:1, duration:0.2, overwrite:true })); }

function shake(card) {
  gsap.to(card.inter, { keyframes:{ x:[0, -10, 10, -7, 7, -3, 0] }, duration:0.4, ease:'none', overwrite:true });
}

function playable(c) {
  const top = discard[discard.length - 1];
  return c.color === 'wild' || c.color === color || (top && c.value === top.value);
}

function onCardClick(card) {
  if (busy || gameOver || turn !== 0) return;
  if (card.zone === 'deck') return drawCard(0);
  if (card.zone === 'hand' && card.owner === 0) playable(card) ? playCard(0, card) : shake(card);
}

function pickColor() {
  return new Promise(res => {
    const btns = [-135, -45, 45, 135].map((deg, k) => {
      const b = document.createElement('div'), r = CH * 0.95, a = deg * Math.PI / 180, c = COLORS[k];
      b.className = 'pick'; b.style.background = HEX[c]; ui.append(b);
      setPos(b, pilePos.x + Math.cos(a) * r, pilePos.y + Math.sin(a) * r, { width:CW * 0.75, height:CW * 0.75 });
      b.addEventListener('mouseenter', () => gsap.to(b, { scale:1.18, duration:0.2 }));
      b.addEventListener('mouseleave', () => gsap.to(b, { scale:1, duration:0.2 }));
      b.addEventListener('click', () => {
        gsap.to(btns, { scale:0, duration:0.2, stagger:0.03, onComplete:() => { btns.forEach(x => x.remove()); res(c); } });
      });
      return b;
    });
    gsap.from(btns, { scale:0, rotation:-90, duration:0.45, stagger:0.06, ease:'back.out(3)' });
  });
}

// ================= oyun akışı =================
async function playCard(p, card) {
  busy = true; clearHover();
  hands[p].splice(hands[p].indexOf(card), 1);
  card.zone = 'discard'; discard.push(card);
  card.rot = rand(-22, 22); card.dx = rand(-6, 6); card.dy = rand(-6, 6);
  updateSeats(); updateHints();
  gsap.to(card.inter, { x:0, y:0, scale:1, duration:0.2, overwrite:true });

  const t = targetOf(card), special = isNaN(+card.value), dur = p === 0 ? 0.5 : 0.6;
  const tl = fly(card, t, { dur, squash:true, flipDelay:0.08, spin:special ? (Math.random() < 0.5 ? -360 : 360) : 0 });
  tl.call(() => impact(pilePos.x, pilePos.y, card.color === 'wild' ? '#fff' : HEX[card.color]), null, dur);
  relayoutHand(p, 0.45, 0.03);
  await tl;

  if (!hands[p].length) return win(p);
  if (card.color === 'wild') {
    const c = p === 0 ? await pickColor() : botColor(p);
    if (p !== 0) floatText(c === 'red' ? 'Kırmızı!' : c === 'yellow' ? 'Sarı!' : c === 'green' ? 'Yeşil!' : 'Mavi!', pilePos.x, pilePos.y - CH * 0.8, HEX[c]);
    setColor(c, true);
    await wait(0.4);
  } else if (card.color !== color) setColor(card.color, false);
  if (hands[p].length === 1) {
    const h = hands[p][0].el;
    floatText('UNO!', gsap.getProperty(h, 'x'), gsap.getProperty(h, 'y') - (p === 2 ? -CH * 0.6 : CH * 0.6), '#f5c400');
  }
  nextTurn();
}

async function drawCard(p) {
  busy = true; clearHover();
  if (!deck.length) await reshuffle();
  if (!deck.length) return nextTurn();
  const card = deck.pop();
  card.zone = 'hand'; card.owner = p; hands[p].push(card);
  updateSeats(); updateHints();
  const tl = fly(card, targetOf(card), { dur:0.6, peak:p === 0 ? 1.3 : 1.1, flipDelay:0.15 });
  relayoutHand(p, 0.45, 0.02, card);
  await tl;
  nextTurn();
}

function botColor(p) {
  const n = {}; hands[p].forEach(c => { if (c.color !== 'wild') n[c.color] = (n[c.color] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || COLORS[Math.floor(Math.random() * 4)];
}

function botMove(p) {
  const ok = hands[p].filter(playable);
  if (!ok.length) return drawCard(p);
  playCard(p, ok.find(c => c.color === color) || ok.find(c => c.color !== 'wild') || ok[0]);
}

function nextTurn() {
  if (gameOver) return;
  turn = (turn + 1) % 4;
  startTurn();
}

async function startTurn() {
  updateSeats();
  if (turn === 0) { busy = false; updateHints(); return; }
  busy = true; updateHints();
  await wait(0.75);
  botMove(turn);
}

function shuffleAnim() { // deste ikiye ayrılıp iç içe geçer (riffle)
  const top = deck.slice(-24), tl = gsap.timeline();
  for (let r = 0; r < 2; r++) {
    top.forEach((c, i) => {
      const t = targetOf(c), side = i % 2 ? 1 : -1;
      tl.to(c.el, { x:t.x + side * CW * 0.62, y:t.y - 6, rotation:side * 10, duration:0.18, ease:'power2.out' }, r * 0.6);
      tl.to(c.el, { x:t.x, y:t.y, rotation:0, duration:0.2, ease:'power2.in' }, r * 0.6 + 0.22 + i * 0.008);
    });
  }
  return tl;
}

async function reshuffle() {
  const top = discard.pop();
  deck = shuffleArr(discard); discard = [top];
  deck.forEach(c => { c.zone = 'deck'; c.owner = -1; });
  floatText('Karıştırılıyor', deckPos.x, deckPos.y - CH * 0.8);
  const tl = gsap.timeline();
  deck.forEach((c, i) => tl.add(fly(c, targetOf(c), { dur:0.45, lift:40, peak:1.05 }), i * 0.012));
  await tl;
  await shuffleAnim();
}

function win(p) {
  gameOver = true; busy = true; updateSeats(); updateHints();
  $('#bannerText').textContent = p === 0 ? 'Kazandın! 🎉' : `${NAMES[p]} kazandı`;
  const b = $('#banner'); b.style.display = 'flex';
  gsap.fromTo(b, { scale:0, rotation:-8 }, { scale:1, rotation:0, duration:0.6, ease:'back.out(2)' });
  for (let k = 0; k < 6; k++)
    gsap.delayedCall(k * 0.15, () => impact(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.7), Object.values(HEX)[k % 4]));
}

async function newGame() {
  gsap.globalTimeline.clear();          // çalışan tüm animasyon/bekleme zincirlerini iptal eder
  fx.innerHTML = ''; document.querySelectorAll('.pick').forEach(b => b.remove());
  $('#banner').style.display = 'none';
  gameOver = false; busy = true; turn = 0; color = null;
  hands = [[], [], [], []]; discard = [];
  measure(); layoutStatic(); buildCards();
  deck = shuffleArr(cards.slice());
  deck.forEach(place);
  gsap.set(table, { '--tint':'#3a4466' }); gsap.set('#colorRing', { borderColor:'#3a4466' });
  updateSeats(); updateHints(); $('#status').textContent = 'Karıştırılıyor…';

  // deste yukarıdan düşer, karıştırılır
  await gsap.from(deck.map(c => c.el), { y:'-=' + H * 0.6, opacity:0, duration:0.6, stagger:0.003, ease:'power3.out' });
  await shuffleAnim();

  // dağıtma: 7 tur, soldan başlayarak
  $('#status').textContent = 'Dağıtılıyor…';
  const order = [];
  for (let r = 0; r < 7; r++) for (const p of [1, 2, 3, 0]) {
    const c = deck.pop(); c.zone = 'hand'; c.owner = p; hands[p].push(c); order.push(c);
  }
  const tl = gsap.timeline();
  order.forEach((c, k) => {
    tl.add(fly(c, targetOf(c), { dur:0.42, lift:60, peak:1.05, flipDelay:0.22 }), k * 0.07);
    tl.call(updateSeats, null, k * 0.07 + 0.4);
  });
  await tl;

  // ilk kart: sayı kartı olana kadar desteden seç
  let idx = deck.length - 1;
  while (isNaN(+deck[idx].value)) idx--;
  const first = deck.splice(idx, 1)[0];
  first.zone = 'discard'; first.rot = rand(-10, 10); discard.push(first);
  const ft = fly(first, targetOf(first), { dur:0.6, squash:true, lift:90 });
  ft.call(() => impact(pilePos.x, pilePos.y, HEX[first.color]), null, 0.6);
  await ft;
  setColor(first.color, true);
  await wait(0.3);
  startTurn();
}

// ================= kontroller =================
$('#restart').onclick = newGame;
$('#again').onclick = newGame;
$('#speed').oninput = e => {
  const v = +e.target.value;
  gsap.globalTimeline.timeScale(v);
  $('#speedVal').textContent = v + 'x';
};
addEventListener('resize', () => {
  measure(); layoutStatic();
  cards.forEach(c => { gsap.killTweensOf(c.el); place(c); });
});

newGame();
</script>
